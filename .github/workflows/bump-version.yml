name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0-pre.1 or 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Bump Version and Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Error: version_name must be X.Y, X.Y.Z, or a pre-release such as 1.0-pre.1"
            exit 1
          fi

      - name: Calculate version code
        id: ver
        run: |
          CURRENT_CODE=$(sed -n 's/^app\.versionCode=//p' gradle.properties)
          if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]] || (( CURRENT_CODE >= 2100000000 )); then
            echo "Error: invalid or exhausted app.versionCode"
            exit 1
          fi
          VERSION_CODE=$((CURRENT_CODE + 1))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Update gradle.properties
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          sed -i "s/^app\.versionName=.*/app.versionName=$VERSION/" gradle.properties
          sed -i "s/^app\.versionCode=.*/app.versionCode=${{ steps.ver.outputs.version_code }}/" gradle.properties
          echo "Updated to versionName=$VERSION, versionCode=${{ steps.ver.outputs.version_code }}"
          grep "app\.version" gradle.properties

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "bump version"
          git tag "$VERSION"
          git push origin master
          git push origin "$VERSION"
