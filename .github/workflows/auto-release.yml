name: Automatic Release

# 每次 push commit（非 PR）签名构建 full/lite release APK，并创建 GitHub Release。
# 对齐 Project-Lumen build.yml 的 Automatic release 行为。
# Secrets（优先 KEYSTORE_*，回退 ANDROID_*）:
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   或 ANDROID_SIGNING_KEY / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Android release + GH Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./rs-hf-tokenizer/target/
          key: rust-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-cache-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Read build identity
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -E '^app\.versionName=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          VERSION_CODE="${GITHUB_RUN_NUMBER:-$(date -u +%s)}"
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE="$(date -u +%s)"
          fi
          BUILD_TIME_UTC_MILLIS="$(date -u +%s%3N)"
          COMMIT_HASH="${GITHUB_SHA}"
          SHORT_HASH="${GITHUB_SHA::8}"
          {
            echo "ZHPLUS_VERSION_NAME=${VERSION_NAME:-0.0.0}"
            echo "ZHPLUS_VERSION_CODE=${VERSION_CODE}"
            echo "ZHPLUS_BUILD_TIME_UTC_MILLIS=${BUILD_TIME_UTC_MILLIS}"
            echo "ZHPLUS_COMMIT_HASH=${COMMIT_HASH}"
            echo "ZHPLUS_SHORT_HASH=${SHORT_HASH}"
          } >> "$GITHUB_ENV"

      - name: Resolve signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_B64="$(printf '%s' "${KEYSTORE_BASE64:-${ANDROID_SIGNING_KEY:-}}" | tr -d '[:space:]')"
          STORE_PASS="$(printf '%s' "${KEYSTORE_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ALIAS="$(printf '%s' "${KEY_ALIAS:-${ANDROID_KEY_ALIAS:-}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KEY_PASS="$(printf '%s' "${KEY_PASSWORD:-${ANDROID_KEY_PASSWORD:-}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          echo "KEYSTORE present: $([ -n "$SIGNING_B64" ] && echo yes || echo no)"
          echo "KEYSTORE length: ${#SIGNING_B64}"
          echo "ALIAS present: $([ -n "$ALIAS" ] && echo yes || echo no)"

          if [ -z "$SIGNING_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Release signing secrets incomplete. Set KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD (or ANDROID_* equivalents)."
            exit 1
          fi

          KEYSTORE_PATH="${{ github.workspace }}/zhihu.jks"
          printf '%s' "$SIGNING_B64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode keystore base64."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" -alias "$ALIAS" >/tmp/keystore-alias.txt 2>/tmp/keystore-alias.err; then
            echo "::error::Keystore validation failed for alias '$ALIAS'."
            cat /tmp/keystore-alias.err
            exit 1
          fi
          cat /tmp/keystore-alias.txt

          # app/build.gradle.kts env signingConfig expects Base64 in signingKey + passwords.
          {
            echo "signingKey=$SIGNING_B64"
            echo "keyStorePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          ZHPLUS_VERSION_NAME: ${{ env.ZHPLUS_VERSION_NAME }}
          ZHPLUS_VERSION_CODE: ${{ env.ZHPLUS_VERSION_CODE }}
          ZHPLUS_BUILD_TIME_UTC_MILLIS: ${{ env.ZHPLUS_BUILD_TIME_UTC_MILLIS }}
          ZHPLUS_COMMIT_HASH: ${{ env.ZHPLUS_COMMIT_HASH }}
          ZHPLUS_SHORT_HASH: ${{ env.ZHPLUS_SHORT_HASH }}
          signingKey: ${{ env.signingKey }}
          keyStorePassword: ${{ env.keyStorePassword }}
          keyAlias: ${{ env.keyAlias }}
          keyPassword: ${{ env.keyPassword }}
          CI_BUILD_MINIFY: "true"
        run: |
          set -euo pipefail
          ./gradlew assembleFullRelease assembleLiteRelease --no-daemon --warning-mode all

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${ZHPLUS_VERSION_NAME}-${ZHPLUS_SHORT_HASH}"
          FULL_APK="$(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          LITE_APK="$(find app/build/outputs/apk/lite/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$FULL_APK" ] || [ -z "$LITE_APK" ]; then
            echo "Missing release APKs"
            find app/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi
          cp "$FULL_APK" "release-assets/zhihu++-full_${VERSION}.apk"
          cp "$LITE_APK" "release-assets/zhihu++-lite_${VERSION}.apk"
          if [ -f app/build/outputs/mapping/liteRelease/mapping.txt ]; then
            zip -j "release-assets/mapping-lite_${VERSION}.zip" app/build/outputs/mapping/liteRelease/mapping.txt
          fi
          (
            cd release-assets
            sha256sum ./* > checksums.txt
          )

      - name: Automatic release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          make_latest: true
          generate_release_notes: true
          tag_name: "v${{ env.ZHPLUS_VERSION_NAME }}-${{ env.ZHPLUS_SHORT_HASH }}"
          name: "Zhihu++ ${{ env.ZHPLUS_VERSION_NAME }}-${{ env.ZHPLUS_SHORT_HASH }}"
          prerelease: false
          body: |
            自动构建发布（commit `${{ env.ZHPLUS_SHORT_HASH }}`）。

            - Full：含端侧 AI / 智能过滤
            - Lite：体积更小

            请仅从官方仓库 Release 安装。Zhihu++ 永久免费，谨防上当受骗。
          files: release-assets/*

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhihu-plus-plus-release-${{ env.ZHPLUS_SHORT_HASH }}
          path: release-assets/*
          retention-days: 30
