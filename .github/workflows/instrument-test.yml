name: Instrument Tests

on:
  pull_request:
    paths:
      - "app/**"
      - "shared/**"
      - ".github/scripts/run-instrumented-shard.sh"
      - ".github/workflows/instrument-test.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

concurrency:
  group: instrument-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-instrumented-shards:
    name: Mock Instrumented Shard (${{ matrix.shard_label }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
          - shard_index: 4
            shard_label: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mock-mode connected androidTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-instrumented-shard.sh 5 ${{ matrix.shard_index }}

      - name: Upload shard test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-instrumented-shard-${{ matrix.shard_label }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn

  android-instrument-tests:
    name: Mock Instrumented Tests
    if: always()
    needs: mock-instrumented-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all instrumented test shards
        env:
          SHARD_RESULT: ${{ needs.mock-instrumented-shards.result }}
        run: test "$SHARD_RESULT" = "success"
